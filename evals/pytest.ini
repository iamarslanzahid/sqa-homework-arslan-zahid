[pytest]
# Noise from deepeval / google-genai internals, not from this suite.
filterwarnings =
    ignore::DeprecationWarning
# Retry once on a transient judge-API hiccup before failing (pytest-rerunfailures ships
# with deepeval). A real rubric failure still fails on the first run's assertion.
addopts = -q --reruns 1 --reruns-delay 5
