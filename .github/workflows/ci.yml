name: suite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r evals/requirements.txt

      # Browser suite + Part 2 LLM eval. The eval self-skips if the secret is absent,
      # so a fork PR without secrets still gets a green browser run.
      - run: npm test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: artifacts/report
          retention-days: 14
